function dataView(s,ui){const d=s.datasets.find(d=>d.id===ui.dataset)||s.datasets[0],rows=ui.queryResults??d?.rows??[],start=(ui.dataPage||0)*100,slice=rows.slice(start,start+100),cols=[...new Set(rows.slice(0,100).flatMap(Object.keys))];return heading('Data workspace','Ingest, inspect, query, and transform your operational data.','database',b('Add document','add-document','file')+b('Import CSV / JSON','import-data','upload','primary'))+`<section class="dataset-workspace"><aside class="dataset-sidebar"><h4 class="section-title" style="margin:7px 8px 14px">DATASETS <span class="count">${s.datasets.length}</span></h4>${s.datasets.map(ds=>`<button class="dataset-item ${ds.id===d?.id?'active':''}" data-action="select-dataset" data-id="${ds.id}">${icon('database',17)}<span><b>${e(ds.name)}</b><small>${number(ds.rows.length)} records · ${e(ds.source)}</small></span></button>`).join('')}<h4 class="section-title" style="margin:24px 8px 14px">DOCUMENTS</h4>${s.documents.map(doc=>`<button class="dataset-item" data-action="view-document" data-id="${doc.id}">${icon('file',16)}<span><b>${e(doc.title)}</b><small>${doc.text.length} characters</small></span></button>`).join('')}</aside><div class="dataset-main">${d?`<div class="dataset-details"><div><h2>${e(d.name)}</h2><p class="subheading">${e(d.description||'Local dataset')} · <code>${e(d.id)}</code></p></div><div class="actions">${b('Profile','profile-data','chart','small')}${b('Add row','add-row','plus','small')}${b('Export','export-data','download','small')}</div></div><div class="query-box"><textarea id="sql-query" spellcheck="false" aria-label="SQL query">${e(ui.queryText||`SELECT * FROM ${d.id} LIMIT 100`)}</textarea><div class="query-controls"><span class="tiny muted">SELECT · WHERE · GROUP BY · ORDER BY · LIMIT · no eval()</span><div class="actions">${ui.queryResults?b('Clear result','clear-query','x','small ghost'):''}${b('Run query','run-query','play','small primary')}</div></div></div>${table(slice,cols,{cellAction:ui function ontologyView(s,ui){const types=s.objectTypes,query=(ui.objectFilter||'').toLowerCase(),rows=s.objects.filter(o=>(!ui.objectType||o.type===ui.objectType)&&JSON.stringify(o).toLowerCase().includes(query));const selected=s.objects.find(o=>o.id===ui.objectSelected);return heading('Ontology','A connected model of the things, relationships, and actions in your operations.','network',b('New object type','new-object-type','layers')+b('Add relationship','new-link','link')+b('Create object','new-object','plus','primary'))+tabs([['graph','Object graph',s.objects.length],['table','Object explorer'],['schema','Schema',types.length]],ui.ontologyTab,'ontology')+(ui.ontologyTab==='schema'?`<section class="content-scroll"><div class="three-col">${types.map(t=>`<div class="panel"><div class="panel-head"><div class="row">${icon('layers',17)}<h3>${e(t.name)}</h3></div>${badge(`${s.objects.filter(o=>o.type===t.name).length} objects`)}</div><div class="panel-body">${t.properties.map(p=>`<div class="property-line"><code>${e(p)}</code><span class="muted tiny">property</span></div>`).join('')}${b('Edit schema','edit-type','edit','small wide mt',`data-id="${e(t.name)}"`)}</div></div>`).join('')}</div></section>`:ui.ontologyTab==='table'?`<section class="tab-content"><div class="row justify mb"><div class="search-input" style="width:260px">${icon('search',14)}<input id="object-search" placeholder="Search objects…" value="${e(ui.objectFilter||'')}"></div><select id="object-type-filter" aria-label="Object type"><option value="">All object types</option>${types.map(t=>`<option ${ui.objectType===t.name?'selected':''}>${e(t.name)}</option>`).join('')}</select></div><div class="panel" id="object-table">${objectTable(rows)}</div></section>`:`<section class="ontology-layout"><div class="minw0" style="display:flex;flex-direction:column"><div class="toolbar"><span class="tiny muted">${s.objects.length} objects · ${s.links.length} relationships · drag nodes to explore</span><div class="actions" function pipelineView(s,ui){const p=s.pipelines.find(p=>p.id===ui.pipeline)||s.pipelines[0],n=p?.nodes.find(n=>n.id===ui.pipelineNode)||p?.nodes[0],run=ui.pipelineResult||p?.runs.at(-1);return heading('Pipeline builder','Executable data transformations, explicit lineage, and inspectable results.','flow',b('New pipeline','new-pipeline','plus')+b('Add block','add-block','plus')+b('Run pipeline','run-pipeline','play','primary'))+`<div class="toolbar"><div class="row"><select id="pipeline-select" aria-label="Select pipeline" style="font-size:10px;padding:5px">${s.pipelines.map(x=>`<option value="${x.id}" ${p.id===x.id?'selected':''}>${e(x.name)}</option>`).join('')}</select>${badge(`${p.nodes.length} blocks`)}</div><div class="actions">${b('Export definition','export-pipeline','download','small')}${b('Save outputs as datasets','materialize-pipeline','database','small',!run?.outputs?.length?'disabled':'')}</div></div><section class="pipeline-layout"><div class="pipeline-main"><div class="pipeline-canvas"><div class="flow-board"><svg class="flow-connections" viewBox="0 0 1220 400">${p.nodes.flatMap(node=>(node.inputs||[]).map(id=>{const from=p.nodes.find(n=>n.id===id);return from?`<path d="M${from.x+214} ${from.y+30} C${from.x+248} ${from.y+30} ${node.x-40} ${node.y+30} ${node.x} ${node.y+30}" stroke="#9baec5" fill="none" stroke-width="1.5"/>`:'';})).join('')}</svg>${p.nodes.map(node=>`<div class="flow-node ${n?.id===node.id?'active':''}" data-action="select-block" data-id="${node.id}" style="left:${node.x}px;top:${node.y}px" tabindex="0"><div class="flow-node-head">${icon(node.type==='source'?'database':node.type==='filter'?'filter':node.type==='output'?'table':'code',17)}${e(node.name)}</div><div class="flow-node-body"><span class="badge blue" style="font-size:8px;margin-right:4px">${e(node.type)}</span>${e(node.config.expression||node.config.name||s.datasets.find(d=>d.id===node.config.dataset)?.name||node.config.group||'Configure transformation')}</div></div>`).join('' function automationsView(s){return heading('Automations','Event-driven checks and manually triggered jobs, with an inspectable run history.','bolt',b('Create automation','new-automation','plus','primary'))+`<section class="content-scroll"><div class="mb">${notice('Local automations run only while this app is open. Diagram-change triggers run structural checks. They do not start background server jobs or execute plant actions.')}</div><div class="stack">${s.automations.map(a=>`<div class="panel automaton"><span class="pill-icon">${icon('bolt',22)}</span><div><h3>${e(a.name)}</h3><p>Trigger: ${e(a.trigger)} → ${e(a.action)} · ${a.lastRun?'Last run '+e(relativeDate(a.lastRun)):'Not run yet'}</p></div><div class="actions">${badge(a.enabled?'Enabled':'Disabled',a.enabled?'green':'')}<input class="switch" type="checkbox" data-automation="${a.id}" ${a.enabled?'checked':''} aria-label="Enable ${e(a.name)}">${b('Run now','run-automation','play','small',`data-id="${a.id}"`)}${b('Edit','edit-automation','edit','small',`data-id="${a.id}"`)}</div></div>`).join('')}</div><div class="panel mt"><div class="panel-head"><h3>Automation execution log</h3></div>${table(s.runs.filter(r=>r.kind==='automation').toReversed(),[{key:'time',label:'Time',render:v=>e(new Date(v).toLocaleString())},{key:'name',label:'Automation'},{key:'status',label:'Status',render:v=>badge(v,v)},{key:'summary',label:'Result'}],{empty:'No automation runs yet.'})}</div></section>`;}
