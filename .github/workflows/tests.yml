name: Core tests and standalone build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release file checksums
        run: sha256sum --check MANIFEST.sha256
      - run: npm test
      - run: python3 tools/build-singlefile.py
      - name: Check generated release is current
        run: git diff --exit-code -- stratum-intelligence.html
