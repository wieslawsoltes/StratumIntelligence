name: Import verified Stratum release
on:
  push:
    branches: [main]
    paths: ['.import/READY']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-stratum-release
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and unpack original source
        run: |
          python3 - <<'PY'
          import hashlib, io, pathlib, tarfile
          root = pathlib.Path.cwd()
          payload = b''.join((root / '.import' / f'part-{i:02d}').read_bytes() for i in range(10))
          expected = 'b56612339dd050b8c9186aaaaa89370e9767e77355e55aefce9206310090670a'
          assert hashlib.sha256(payload).hexdigest() == expected, 'Source archive checksum mismatch'
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:xz') as archive:
              members = archive.getmembers()
              assert len(members) == 50
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ('.git', '.github', '.import')
              archive.extractall(root, filter='data')
          PY
      - name: Run core tests and build release
        run: |
          npm test
          npm run build:pages
      - name: Generate documentation screenshots
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tools/capture-screenshots.py
      - name: Commit expanded application and remove transfer files
        run: |
          rm -rf .import
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          excluded = {'.git', '.github', '_site', '__pycache__', 'node_modules', 'vendor'}
          files = sorted(p for p in root.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256' and not excluded.intersection(p.parts))
          Path('MANIFEST.sha256').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.as_posix()}\n' for p in files))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import Stratum Intelligence 0.1 with P&ID Studio, engines, tests and documentation'
          git push origin HEAD:main
